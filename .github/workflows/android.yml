name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Android lint
        shell: bash
        run: |
          if ! gradle :app:lintDebug --stacktrace; then
            report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
            if [ -f "$report" ]; then
              echo "::group::Android lint report"
              cat "$report"
              echo "::endgroup::"
            fi
            exit 1
          fi
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
      - name: Assemble release
        run: gradle :app:assembleRelease --stacktrace
      - name: Compile instrumentation tests
        run: gradle :app:assembleDebugAndroidTest --stacktrace

  emulator-acceptance-api29:
    name: emulator-acceptance-api29
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Accept Android SDK licenses
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -n "$sdkmanager"
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
      - name: Run Android 10 managed-device acceptance tests
        run: >-
          gradle :app:pixel2Api29DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace
      - name: Upload Android 10 acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dialer-managed-device-api29-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/managedDevice/debug/pixel2Api29/
            app/build/outputs/androidTest-results/managedDevice/debug/pixel2Api29/
          if-no-files-found: warn
          retention-days: 14

