name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DIALER_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DIALER_SOURCE_REVISION }}
          persist-credentials: false
      - name: Verify exact Dialer source revision
        run: test "$(git rev-parse HEAD)" = "$DIALER_SOURCE_REVISION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Assemble debug
        run: gradle :app:assembleDebug --stacktrace
